apiVersion: apps/v1
kind: Deployment
metadata:
  name: prodev-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prodev-project
  template:
    metadata:
      labels:
        app: prodev-project
    spec:
      containers:
      - name: prodev-project
        image: aryansinghh1/devops-project:1
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http